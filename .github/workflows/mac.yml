# Builds FreeShape for Windows, Mac and Linux on GitHub's own computers, tests each one, and attaches the
# downloads to the release — so there's nothing to build by hand.
#   - Publishing a release: builds all three and attaches
#       FreeShape-Setup-<rev>.exe, FreeShape-portable-<rev>.zip (Windows, no install),
#       FreeShape-<rev>-mac-arm64.dmg and FreeShape-<rev>-x86_64.AppImage
#   - Actions tab → "Build (Windows, Mac, Linux)" → Run workflow: a test build. The files, a screenshot of
#     FreeShape running on the Mac and the logs go on a "Test builds" DRAFT release instead — drafts are only
#     visible to you (Releases page), never to the public. Each test run replaces the previous test files.
#   - Pushing a tag v<version>-fork.<n> (this fork, e.g. v2.0.0-fork.1): makes a draft release for the tag,
#     builds everything, attaches it, then publishes the release. Plain v<version> tags are upstream's and
#     build nothing here. Linux also gets freeshape_<version>_amd64.deb for Debian and Ubuntu.
# (The file is still called mac.yml because it started as the Mac build.)
name: Build (Windows, Mac, Linux)

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - "v*-fork.*"

permissions:
  contents: write

env:
  # The release the built files go on: a pushed tag's, a published release's, else the private "Test builds" draft.
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || (github.event_name == 'push' && github.ref_name || 'test-builds') }}

jobs:
  # ------------------------------------------------------------------ test runs: one private draft to put them on
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Make sure the "Test builds" draft exists
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view test-builds >/dev/null 2>&1 || \
            gh release create test-builds --draft --title "Test builds" \
              --notes "Automatic test builds (draft - only visible to you). Each test run replaces these files."
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
      - name: Make a draft release for the pushed tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          V="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' freeshape/__init__.py)"
          case "$RELEASE_TAG" in
            "v$V"-fork.*) ;;
            *) echo "::error::Tag $RELEASE_TAG does not match the code's version $V (expected v$V-fork.<n>)"; exit 1 ;;
          esac
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "FreeShape $RELEASE_TAG" --generate-notes

  # ------------------------------------------------------------------ Windows: installer
  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.16"
      - name: TEMPORARY git timing diagnostic (issue 52)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python scripts/diag_git_timing.py
      - name: Build FreeShape.exe and check it starts
        run: |
          build() { python -m PyInstaller packaging/freeshape.spec --noconfirm --clean --distpath dist --workpath build; }
          check() { rm -f selftest.txt; dist/FreeShape/FreeShape.exe --self-test "$PWD/selftest.txt"; grep -q '^OK' selftest.txt; }
          build
          if ! check; then
            echo "Quick build is missing something - building again with every library included"
            export FREESHAPE_FULL=1
            build
            check || { cat selftest.txt; exit 1; }
          fi
          cat selftest.txt
      - name: Time opening a small Document (issue 52; information only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          # each run: start FreeShape, wait the given seconds on Home, open a one-Part-Studio Document as a card
          # click does, and wait for its first rebuild from the worker. The first run is a first-ever start.
          for spec in "cold 0" "cold 0" "cold 20" "prewarm 0" "prewarm 20"; do
            set -- $spec
            rm -f open-timing.txt
            start=$(date +%s.%N)
            dist/FreeShape/FreeShape.exe --open-timing "$PWD/open-timing.txt" $1 $2 || true
            echo "== $1, $2 s on Home (whole run $(python -c "import time; print(round(time.time() - $start, 1))") s)"
            cat open-timing.txt || echo "(no output)"
          done
      - name: Build the installer
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then choco install innosetup -y --no-progress; fi
          "$ISCC" //Q packaging/FreeShape.iss
          ls -la dist
      - name: Make the portable zip (unzip anywhere and run FreeShape.exe — nothing to install)
        run: |
          REV="$(python -c 'import freeshape; print(freeshape.__version__)')"
          powershell -NoProfile -Command "Compress-Archive -Path 'dist\FreeShape' -DestinationPath 'dist\FreeShape-portable-$REV.zip'"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: freeshape-windows
          path: |
            dist/FreeShape-Setup-*.exe
            dist/FreeShape-portable-*.zip
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" dist/FreeShape-Setup-*.exe dist/FreeShape-portable-*.zip --clobber

  # ------------------------------------------------------------------ Mac: .dmg (Apple Silicon)
  mac:
    needs: prepare
    runs-on: macos-latest      # GitHub's current Mac (Apple Silicon)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest
      # Every commit is already tested on Linux by the gate workflow (both OpenCascade versions). On the Mac the
      # whole suite is for information on a test build only: it never blocks a build, and a tag release skips it.
      - name: Run the tests
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 30
        run: python -m pytest -q tests 2>&1 | tee test-results.txt
      - name: Build FreeShape.app and the .dmg
        run: bash packaging/mac/build_mac.sh 2>&1 | tee build-log.txt
      - name: Start the app and take a screenshot
        continue-on-error: true
        run: |
          export FREESHAPE_NO_RECOVERY=1
          # FreeShape saves a picture of its own window after 30 s and quits
          FREESHAPE_SNAPSHOT="$PWD/mac-screenshot.png" FREESHAPE_SNAPSHOT_DELAY=30000 \
            dist/FreeShape.app/Contents/MacOS/FreeShape examples/bracket.fshape > app-log.txt 2>&1 &
          APP=$!
          for i in $(seq 1 90); do kill -0 $APP 2>/dev/null || break; sleep 1; done
          if [ -f mac-screenshot.png ]; then echo "SNAPSHOT OK" >> app-log.txt; else echo "NO SNAPSHOT" >> app-log.txt; fi
          kill $APP 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: freeshape-mac
          path: |
            dist/*.dmg
            mac-screenshot.png
            app-log.txt
            build-log.txt
            test-results.txt
          if-no-files-found: warn
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RELEASE_TAG" != "test-builds" ]; then
            gh release upload "$RELEASE_TAG" dist/*.dmg --clobber
          else
            files=""
            for f in dist/*.dmg mac-screenshot.png app-log.txt build-log.txt test-results.txt; do [ -f "$f" ] && files="$files $f"; done
            gh release upload test-builds $files --clobber
          fi

  # ------------------------------------------------------------------ Linux: AppImage
  linux:
    needs: prepare
    runs-on: ubuntu-22.04      # an older Ubuntu, so the AppImage also runs on older Linux systems
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libfontconfig1 libdbus-1-3 file
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build the AppImage
        run: PYTHON=python bash packaging/linux/build_appimage.sh
      - name: Build the .deb (Debian and Ubuntu)
        run: |
          if [ "$RELEASE_TAG" != "test-builds" ]; then
            # v2.0.0-fork.1 -> 2.0.0+fork.1: a Debian version sorts "-" as a packaging revision, "+" as part of the version
            export FREESHAPE_DEB_VERSION="$(echo "${RELEASE_TAG#v}" | sed 's/-fork\./+fork./')"
          fi
          PYTHON=python bash packaging/linux/build_deb.sh
          dpkg-deb --info dist/*.deb
      - name: Install the .deb and check the installed app
        run: |
          sudo apt-get install -y ./dist/*.deb
          rm -f deb-selftest.txt
          freeshape --self-test "$PWD/deb-selftest.txt" || true
          cat deb-selftest.txt
          grep -q '^OK' deb-selftest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: freeshape-linux
          path: |
            dist/*.AppImage
            dist/*.deb
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*.AppImage dist/*.deb --clobber

  # ------------------------------------------------------------------ a pushed tag: publish once everything is attached
  publish:
    needs: [windows, mac, linux]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --draft=false
